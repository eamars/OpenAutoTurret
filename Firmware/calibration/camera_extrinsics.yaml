# ota-camera-extrinsics v1
# Camera-to-pitch-frame rotation for the unloaded station, 2026-09-06.
#
# The previous rot_z(-90 deg) matrix got the image axes' signs right but omitted
# the pitch boresight offset. It predicted substantial image roll during a
# horizontal roam. A 136-pair stationary-background flow recording measured
# median reprojection error 15.89 px with that matrix.
#
# Correction: R_P_C = rot_y(-0.860 rad) * rot_z(-pi/2).
# The pitch offset was fitted to two stopped yaw moves at q_pitch ~= -0.697 rad.
# Independent yaw moves at q_pitch ~= -0.64 rad reduced median feature error
# from 72.54 / 53.45 px to 8.23 / 10.80 px. Pitch moves retained their correct
# sign and had 4.30--5.33 px residuals. The offset includes the encoder's pitch
# zero relative to the optical axis; it is not a camera image rotation.
#
# Evidence: docs/automatic_service_validation_2026_09_06.md and the Pi's
# run/{roam,dwell}-projection-geometry.json. Features exclude detected people.
# This is a provisional direction-only calibration, not a full extrinsic fit:
# translation/parallax and lens distortion remain unmeasured. Do not infer
# their values from this rotational walk. Translation below is unused by LOS.
#
# Format: t_P_C key followed by three row-major rotation rows.
t_P_C=0 0 0
0 0.6524374681640519 -0.757842562895277
-1 0 0
0 0.757842562895277 0.6524374681640519
