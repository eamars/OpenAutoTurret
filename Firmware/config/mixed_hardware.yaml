# Dedicated production topology for the split-bus installation.
# This profile is validated independently; it is not a migration fallback for
# the legacy single-bus config/turret.yaml.
schema_version: 1

buses:
  yaw:
    interface: can0
    spi_parent: spi0.0
    bitrate: 1000000
  pitch:
    interface: can1
    spi_parent: spi1.0
    bitrate: 1000000

axes:
  yaw:
    protocol: gm6020
    bus: yaw
    motor_id: 1
    topology: continuous
    # Torque current, not voltage. Two facts decided this on 2026-09-28, both measured on this
    # motor with controld stopped (reports/CURRENT_MODE_MIGRATION_2026-09-28.md):
    #   0x1FE +-0.40 A -> rotor moved +-300 counts, feedback current within 1 % of command;
    #   0x1FF +-8000   -> nothing moved, and the drive still reported 0 A and 0 rpm.
    # The drive was never ignoring the axis, it was ignoring our frames. Voltage mode still
    # parses so this can be rolled back for an A/B -- but a rollback also needs the drive's
    # Current Ring switched back off, so it is not a one-line revert.
    control_mode: current
    feedback_frame_id: 0x205
    command_frame_id: 0x1FE
    # The operator's record of the drive, which no CAN frame can establish: current mode needs
    # firmware >= v1.0.11.2 (the owner flashed it on 2026-09-28) and the Current Ring switch
    # enabled in RoboMaster Assistant v2.7 (sources/GM6020_DRIVE_CONFIG_2026-09-28.md).
    current_ring_verified: true
    # Host-side clamp on commanded torque current. 0.8 A was a deliberately small first envelope,
    # not thermal qualification: 1.62 A rated, 0.90 A continuous stall and the 3 A
    # protocol range describe different conditions. ADR-002 requires measured duty/
    # temperature evidence before raising this envelope for the installed payload.
    #
    # Reverted to 0.8 on 2026-10-01 for the ADR-002.2 handover: this was raised to 1.62 A (rated) during
    # the yaw motion investigation, and it is the ONLY production-behaviour change that work made. The
    # owner's instruction is zero contamination of production modes, and the envelope belongs to the
    # independent calibration module rather than to a diagnosis. The measurement that motivated it stands
    # as evidence for that module to decide on: on the installed cross-roller bearing, drag sweeps moved
    # 2.59 deg at 0.6 A, 11.38 deg at 1.5 A and 45.04 deg at 2.5 A of breakaway feedforward, so 0.8 A
    # cannot drive this bearing through a commanded angle -- that is a finding, not a pre-empted decision.
    host_current_limit_a: 0.8
    # The yaw velocity loop's OUTPUT gains while in current mode, in amperes. Deliberately not
    # derived from the voltage gains: with the drive closing its own current loop, counts and
    # amperes are not two labels on one straight line. Chosen conservative: kp 1.0 A per rad/s
    # asks 0.52 A at the 30 deg/s ceiling -- the same order as the 0.40 A that moved this axis on
    # the bench, and inside the clamp above. Re-derive against a measured step before calling it
    # tuned; the old voltage ceilings (max_output_counts) do not apply in this mode at all.
    current_kp_a_per_rad_s: 1.0
    current_ki_a_per_rad_s: 0.6
    # 0 = this gate is removed, and that is a documented position, not an absence
    # of one. Three things settled it: (a) the official guide gives this feedback
    # byte no unit and the payload no fault bit, so a host-side number here is not
    # an over-temperature signal (owner ruling, 2026-09-27: only a motor-reported
    # over-temperature may cut power); (b) a passive 15 s census of can0 on
    # 2026-09-28 saw only 0x205 feedback at 1 kHz plus our own 0x1FF commands —
    # there is no second status frame to promote into one; (c) an energised-HOLD
    # soak that same night showed the byte falling (36 -> 32 -> 30), so there was
    # no self-heating here to protect against. Yaw thermal truth now travels as an
    # observation (1 Hz temp_raw_yaw, plus the trip matrix) while the driver's own
    # 125 C output cut stays the backstop. Calibrate against the 100 C LED warning
    # before reintroducing any number here as degrees.
    guard_temp_raw_ceiling: 0
  pitch:
    protocol: cybergear
    bus: pitch
    motor_id: 127
    topology: bounded
    control_mode: position
    expected_unique_id_hex: "7216313130333105"
    current_limit_a: 5.0

# ADR-003 3b (2026-10-02): the ADR-002.2 servos, from the assets tools/servo_commission/commission.py
# writes, own both axes whenever the control loop publishes a reference segment (all modes at
# Hold). Homing, braking, emergency stop and fault keep the legacy paths above, which release the
# servo. Paths are relative to this file.
servo:
  yaw_asset: servo/yaw_servo.json
  pitch_asset: servo/pitch_servo.json
  yaw_current_limit_a: 3.0            # owner ruling 2026-10-02: 3 A peak (the protocol full scale)
  yaw_rms_limit_a: 1.62               # ... and 1.62 A continuous (the rating), the servo's RMS budget
  yaw_temperature_limit_raw: 55       # the commissioning sessions' thermal trip
  oscillation_limit_a: 0.3            # limit-cycle guard: fast current RMS (commissioning rule)
  speed_limit_rad_s: 10.47            # owner ruling 2026-10-02: 100 RPM is the safety cap
  # Owner: never drive the pitch into its mechanical end stop. The guard is 2 deg beyond the soft
  # limit, which homing places 5 deg inside the measured ends; toward it the pitch servo's
  # commanded speed always allows a stop at the deceleration its commissioning demonstrated.
  pitch_guard_rad: 0.035
  pitch_stop_acceleration_rad_s2: 1.047
