# OpenAutoTurret — production configuration (architecture §40 / §58).
#
# Commissioning values (§58) below are CONSERVATIVE PLACEHOLDERS: they keep the
# daemon safe (slow speeds, wide soft-limit bands) until the real numbers are
# measured on this mechanism. Update them during commissioning — they are config,
# never compile-time assumptions. The loader treats a missing key or the literal
# "TBD" as "use the built-in conservative default" and records a warning.
schema_version: 1
# §72 — the v3 block, everything in it commented out.
#
# It is commented out because these values move a gimbal, and a value that arrives in a
# station's file because code was merged is a decision nobody made at the bench. The
# defaults are the ones v3 derives from the station itself (roam region from the homed
# soft limits, 300 ms jog lease, 0.5/1/5 degree steps), and they are what is running
# today. Uncomment a key to take responsibility for it.
#
# What naming a value does NOT do: widen where the turret may go. The roam region is
# clamped inside the homed soft limits minus the braking inset, and the runtime envelope
# check still runs, so a named region can only ever narrow the sweep. A named speed may
# only slow it. A boot mode other than MANUAL is refused at load, not clamped — the
# machine does not decide to move because a file said so.
#
# v3:
#   default_mode: MANUAL              # only MANUAL is accepted (§16/§52)
#   auto_roam:
#     yaw_min_deg: 100.0              # must be inside the yaw soft limits (§33)
#     yaw_max_deg: 190.0
#     pitch_deg: -39.6                # one elevation for the whole sweep (§30)
#     velocity_deg_s: 10.0            # may slow the sweep, never speed it past the limit
#   auto_track:
  # Drive-mode item 3 - AIM DEADBAND, opt-in, both default to 0 = OFF (behaviour byte-identical to
  # before these keys existed; the gtest AimDeadband.DisabledByDefaultPassesTheAimThroughUntouched is what
  # enforces that claim rather than this comment).
  #
  # While the predicted line-of-sight stays within deadband_release_deg of the aim we are already pointing
  # at, the aim is NOT re-centred, so detector wobble cannot keep restarting small corrections. Two
  # thresholds on purpose: a deviation past deadband_deg ENTERS the hold, and only one past
  # deadband_release_deg RELEASES it - one threshold chatters at its own boundary. If release < enter the
  # pair is clamped to 1.5x enter and reported (aim_deadband.hpp), never silently trusted.
  #
  # WHAT THIS DOES NOT DO: it does not open the position loop. The axis keeps servoing to the published aim
  # with unchanged authority, so gravity sag, backlash creep and disturbance rejection all stay live, and the
  # supervisor, envelope and safety authority are untouched. What it gives up: a target that creeps slower
  # than the release threshold is NOT followed, so the reticle can sit slightly off-centre on it.
  # Measured floor on this station is 0.02177 deg (smallest step the reported angle can take), so a band at
  # or below that is indistinguishable from quantisation. First value to try on real pixels: 0.1 / 0.15.
  # Drive-mode item 4 - AUTOMATIC MODE HAND-OFF, opt-in, both default to 0 = NEVER (the station changes
  # mode only when you tell it to, which is the behaviour in force today and the behaviour §45 is written
  # around). Set a value and the hand-off happens after the condition has held continuously that long.
  #
  #   roam_on_loss_ms      AUTO_TRACK -> AUTO_ROAM, once the v3 session reaches LostHold (20.2: prediction
  #                        stopped, station holding) and stays there this long. Deliberately LostHold and not
  #                        Acquire/Coasting: walking away mid-coast would abandon a live track.
  #   track_on_acquire_ms  AUTO_ROAM -> AUTO_TRACK, once a selection AND a ready estimator have been held
  #                        this long - the same evidence AUTO_TRACK itself demands before it will move, so a
  #                        hand-off cannot land in a mode that then refuses to drive.
  #
  # It cannot hunt: after ANY automatic hand-off, no further one is allowed for a full
  # reacquire_window_ms (20, default 3000) - an already-tuned figure reused rather than a second number
  # invented. The timers count from when the condition FIRST became true; a timer that refreshed on every
  # sighting could never expire. Only considered from supervisory Ready, and the supervisor keeps its
  # authority over every switch - safety can still take the mode away.
  # roam_on_loss_ms: 5000
  # track_on_acquire_ms: 1000
  # Drive-mode item 2 - POSITION LEAD, opt-in, default 0 = OFF (the commanded position is the reference,
  # exactly as before this key existed).
  #
  # Normal motion commands the DRIVE a position plus a speed limit (control_loop.cpp:1085), so the CyberGear
  # closes its own position loop and controld cannot reach that loop's gain - the only position-gain-looking
  # register in this codebase is Reg::MechPos, a read-back. Measured consequence on this station: while
  # sweeping at 10.00 deg/s the axis trails its commanded position by p50 3.628 deg / p95 4.274 deg, sign
  # following the direction of travel, zero at rest. This asks for where the reference is going instead of
  # where it is, so the drive's own lag stops showing up as a constant shortfall.
  #
  # Two properties are enforced in code (position_lead.hpp), not by this comment: NO lead at zero rate, so a
  # hold, a park and every idle cycle are bit-identical and it cannot creep past what it stopped on; and the
  # command is CLAMPED into the soft limits, so a lead can never push past a safety boundary - the envelope
  # keeps its final word (111.18). The rate estimate is additionally capped by the commanded speed limit, so a
  # reference step cannot manufacture a lead.
  #
  # Start small. The measurement brackets the needed lead at 0.173-0.36 s, which at 10 deg/s is 1.7-3.6 deg;
  # 0.1 s is deliberately about a third of that, because an overshoot at the turnaround is worse than the
  # shortfall it removes. Judge it on the same numbers: following error p50 (was 3.628) and no new overshoot
  # past the sweep extremes.
  # position_lead_s: 0.1
  # deadband_deg: 0.1
  # deadband_release_deg: 0.15
#     coast_ms: 300                   # §20: authority fades this long after the last frame
#     lost_hold_ms: 2000              # when the hold is decided
#     reacquire_window_ms: 3000       # how long a memory of the person is kept
#     confidence_medium_min: 0.50     # §19's bands
#     confidence_high_min: 0.75
#     reacquire_threshold: 0.55       # §21: the score a candidate needs
#     ambiguous_match_margin: 0.15    # §21: and how far ahead of the runner-up
#     confidence_derating:
#       medium_velocity_scale: 0.60   # ceilings; may not exceed 1.0
#       low_velocity_scale: 0.30
#       # *_acceleration_scale is refused: this build applies one ceiling per band (§19),
#       # and a key that does nothing is worse than no key.
#   manual:
#     jog_keepalive_ms: 100           # the page renews at this rate (§38)
#     jog_lease_timeout_ms: 300       # must fit three renewals
#     step_sizes_deg: [0.5, 1.0, 5.0] # may narrow §41's set, never widen it

can:
  # PHY swap point (can_transport.hpp). "socketcan" = MCP2515 HAT on can0;
  # "yousee" = USB-CAN AT adapter on a serial device. Swap freely — nothing
  # else changes. 2026-09-02: HAT field-sick (see
  # docs/archive/research_can_bus_error_passive.md); running on the yousee adapter
  # until the replacement HAT lands. To revert: backend socketcan +
  # interface can0.
  backend: yousee
  interface: /dev/ttyUSB0   # was: can0
  uart_baud: 921600         # yousee adapter UART side
  bitrate: 1000000          # CyberGear runs at 1 Mbit/s.
  host_can_id: 0
motors:
  pitch:
    can_id: 100           # 0x64 (discovery ground truth).
    direction_sign: 1     # logical -> mechanical sense; verify at commissioning.
  yaw:
    can_id: 101           # 0x65 (discovery ground truth).
    direction_sign: -1    # logical -> mechanical sense; verify at commissioning.

control:
  loop_hz: 200            # frozen by §59.4; profiled.

axes:
  pitch:
    # Refined after the first speed-mode homing (p0p): the measured full-range
    # travel is ~80 deg (POC min_travel is 75 deg, so this is the true
    # mechanical span). The sanity band is [0.5x, 1.5x] of the span, so a span
    # of ~140 deg gives [70, 210] deg, which contains the measured 79.5 deg with
    # margin while still catching a short (stopped-early) or over-travel fault.
    expected_travel_deg: { min: -70, max: 70 }
    soft_margin_deg: 5
    max_velocity_deg_s: 30
    max_acceleration_deg_s2: 60
    max_jerk_deg_s3: 300
    # Speed-mode homing: the drive current limit (A) for pitch. The POC
    # reference (zero_pitch_axis) runs pitch at 3 A — high enough to reach and
    # latch the mechanical stop, low enough that friction notches slip. Written
    # to LimitCur (0x7018) on the homing cycle.
    limit_cur_a: 3.0
  yaw:
    # YAW IS A ~360 DEG CONTINUOUS-ROTATION AXIS (user-confirmed). The P0k
    # "end-stops" at raw -1.214..+0.811 rad were FALSE contacts (friction
    # stalls the old stop-at-first-contact homing latched before reaching the
    # real mechanical stops). The homing no longer assumes an angle: it pushes
    # until the mechanical end-stop or >max_rotation_deg (360) of rotation.
    # The band below only sanity-checks the measured span (~360 deg) and is
    # generous: [0.5x, 1.5x] of the 360 deg span = [180, 540] deg.
    expected_travel_deg: { min: 0, max: 360 }
    soft_margin_deg: 5
    max_velocity_deg_s: 30
    max_acceleration_deg_s2: 60
    max_jerk_deg_s3: 300
    # Speed-mode homing: the drive current limit (A) for yaw. The POC reference
    # (zero_yaw_axis) runs yaw at just 1 A — the friction notches SLIP at this
    # current (they never stay stable over the 1.5 s stop window), so only the
    # true mechanical end-stop latches as a stop. Do NOT raise this: a higher
    # current makes the notches hold and produce false stops.
    limit_cur_a: 1.0

homing:
  contact:
    # Speed-mode (velocity) homing: the drive's own velocity loop holds these
    # constant speeds (SpdRef), the smooth source of motion. Values follow the
    # POC reference (zero_pitch_axis 0.5 rad/s, zero_yaw_axis 0.8 rad/s); a
    # single coarse speed is used for both axes (slower than yaw's POC value,
    # safely above the friction-notch slip threshold).
    coarse_speed_deg_s: 30      # ~0.52 rad/s coarse approach (§58 params 8, 10)
    # Fine approach: slower than coarse for a repeatable, stable re-latch at
    # the end-stop (repeatability pass). ~0.26 rad/s.
    fine_speed_deg_s: 15
    # Pushing-confirmation threshold (N.m): the drive's stop-push torque scales
    # with LimitCur, so at the POC homing currents (yaw 1 A / pitch 3 A) it is
    # far below the 0.25 N.m measured at higher currents (P0e). Set low so the
    # "drive is pushing" gate is satisfied at 1 A while a true stop's sustained
    # stall (1.5 s) does the real discrimination. Calibrate on the supervised run.
    current_or_effort_limit: 0.05
    stall_velocity_threshold: 0.5   # rad/s; contact-gate stall (above approach
                                    # speed, so position-progress is the real
                                    # discriminator). Do NOT use for jitter.
    # Jitter/recovery "moving" threshold (rad/s): a breakaway stall is the
    # drive moving at approach speed, stalling, then moving again. Must sit
    # BELOW the approach speed (coarse 10 deg/s = 0.175, fine 20 deg/s =
    # 0.349) and above filtered rest noise. Tuned in A.3 on clean vs jittery
    # data (drive_current_friction_tuning.md §3.4).
    v_move_threshold: 0.10
    # P0j: reject the drive's slow-start ramp (creeps 0.5-1.6 deg/s while
    # pushing 0.2-0.45 N.m against local loads, misread as contact 37 deg
    # short of the true end-stop). Contact now also requires the axis to have
    # reached motion_history_velocity since the approach began, OR a sustained
    # push of at least effort_hard_contact_nm (the measured end-stop plateau
    # 0.43-0.73 N.m). A true coarse stop is reached at ~10 deg/s (0.17 rad/s),
    # well above the ramp's 0.028 rad/s peak.
    effort_hard_contact_nm: 0.40
    motion_history_velocity: 0.05   # rad/s
    # POC stability window: a genuine mechanical stop stays stable; a friction
    # notch SLIPS before 1.5 s. Require the stalled+pushing candidate to persist
    # for 1.5 s (matching the POC zero_axis 3x0.5 s position-span window) so a
    # briefly-holding notch cannot false-positive as a stop. This is the speed-
    # mode analogue of the POC's "position steady ~1.5 s + drive pushing" test.
    contact_dwell_ms: 1500
    backoff_deg: 5
    repeatability_deg: 0.5
    # p3f: the second fine approach can stall in the drive's static-friction
    # zone short of the stop (measured 75-79 deg pitch: 0.1-0.44 N.m,
    # v~0.02) and the detector latches that stall as a false contact, so the
    # (correct) repeatability check rejects a non-repeatable q2. The
    # breakaway is stochastic, so the (small backoff + second approach) pass
    # is re-run this many times on a non-repeatable q2 before faulting. A
    # genuinely non-repeatable stop still faults after the retries.
    repeatability_retries: 2
    # --- Speed-mode homing safety limits ---
    # No adaptive current raise: the homing runs at the per-axis limit_cur_a
    # (pitch 3 A / yaw 1 A) for the whole approach. At these currents the
    # friction notches slip (never stable over the stop window), so a latched
    # contact is the true mechanical end-stop. (limit_cur_step_a /
    # limit_cur_max_a are legacy position-mode push-through parameters; 0 =
    # no raise, which is the speed-mode behavior.)
    limit_cur_step_a: 0.0
    limit_cur_max_a: 0.0
    max_rotation_deg: 360.0  # coarse-approach rotation cap; >this = no stop found
    # |tau| above this aborts the push to protect the mechanical end-stop.
    # CONSERVATIVE first-run value (measured end-stop push is 0.43-0.73 N.m);
    # the run logs peak + at-contact torque so we dial this in together.
    torque_safety_nm: 10.0

# §25.2 executable multi-axis homing plan. Default for the simple pitch/yaw
# gimbal: home each axis across its full mechanical range, PITCH then YAW
# (matches the POC zero_all order; pitch is a bounded axis and homes reliably
# first, so a failure is diagnosed before the long 360 deg yaw sweep).
# There is no articulated payload or known fixed obstruction, so no clearance
# `move` steps are required. If the mechanism gains a payload or an obstruction
# that forces one axis to a safe angle before another traverses, insert `move`
# steps between the homes (architecture §25 / §25.2); the interpreter already
# supports home_endpoint / move / home_full_range.
# Multi-axis homing plan (§25). The axes are mechanically coupled: an axis
# left at a mechanical stop dangles and can steal the OTHER axis's range. So
# after each axis is homed it is parked at a safe mid-travel pose before the
# next axis is homed. Because yaw's orientation sets pitch's usable range,
# pitch is re-zeroed LAST (at the final yaw pose) so its reference is valid
# for the operating orientation. `position_deg` is logical (low stop = 0,
# high stop = travel), so mid-travel ~= travel/2:
homing_plan:
  - action: home_full_range
    axis: pitch
    precision: fine
  - action: move          # park pitch mid-travel so it doesn't dangle during yaw home
    axis: pitch
    position_deg: 40      # ~mid-travel of ~80 deg; adjust to the true no-dangle pose
  - action: home_full_range
    axis: yaw
    precision: fine
  - action: move          # park yaw at the no-dangle pose so it doesn't dangle during pitch re-home
    axis: yaw
    # 176 deg = the yaw GRAVITY BALANCE (center of the 175.6-176.7 deg
    # friction deadband, 4 h 45 m hold data), NOT the travel mid (180).
    # p3b (2026-09-02, wire-confirmed): a 180 deg move from the low stop
    # arrives at 10 deg/s; the drive velocity-loop lag (~0.13 s) overshoots
    # 1.2 deg to 181.2 deg — 5.2 deg past the balance — and the return
    # command (-8.3 deg/s) only produces ~0.1 N.m (P-term at 0.145 rad/s
    # error; the drive's spd_ki is too small to build torque against static
    # friction at a low speed-ref), so the axis could not break away and the
    # move timed out (30 s) -> homing fault. At 176 deg the move is
    # torque-free (the balance point) and any overshoot settles back to the
    # balance on its own, so the mid-park never sticks.
    position_deg: 176
  - action: home_full_range
    axis: pitch
    precision: fine

tracking:
  # The ceiling that actually binds station motion, and (control_loop.cpp:427) the AUTO_TRACK reference
  # too - applied before the confidence derate, so no tracker or prediction tuning can exceed it.
  # Defaulted to 10.0 deg/s, the value previously hard-coded in main.cpp. Round 40 measured the tracking
  # reference pinned at exactly this number; the operator's lead criterion needs ~15.6 deg/s average, so
  # raising it is a decision about how fast this station may swing under payload, not a tuning knob. It
  # is shown live on the panel as SPEED CEILING. Left commented out deliberately: no behaviour change.
  # hold_speed_deg_s: 10.0
  # The operator's acceptance rule is the reticle on the target's HEAD, within one third of the
  # box height. The §9 anchor a detector reports is the box centroid, which on a standing person
  # is a torso - so the rule has to be stated as a station setting, not left to a code default
  # that was chosen before the rule existed. head_fraction_from_top is an assumption about this
  # detector's box, which is why it is here and not a constant.
  aim_at_head: true
  head_fraction_from_top: 0.22
  search_enabled_by_default: false
  target_lost_behavior: hold    # hold | search (§58 params 19-20)

shutdown:
  # §33.1 safe in-travel park pose: the no-dangle mid-travel pose (the same
  # pose the homing plan uses to park each axis between homes). Logical degrees
  # (low stop = 0, high stop = travel). Parking here and de-energizing leaves
  # the arm at its gravity rest (no slide). Adjust only on evidence (P2).
  #
  # YAW: 176 deg, NOT the travel mid (180). Evidence (rehome4, 2026-09-02):
  # a 4 h 45 m energized hold at the ready pose (175.6 deg) showed the yaw
  # gravity balance sits at ~175.6-176.5 deg (the axis wandered +/-0.8 deg
  # stick-slip around it, 2.8 deg total, then re-centered). Parking at 180
  # deg is ~4 deg PAST the balance, so (a) the park move crawls against
  # gravity (~0.07 deg/s position-mode, full 40 s park timeout), (b) Verify
  # can never hold the axis within 0.5 deg of 180 (gravity pulls it back),
  # and (c) the de-energized yaw sat 1.4 deg short of target (rehome1:
  # 3.96 deg short). 176 deg = center of the observed friction deadband.
  # PITCH: 40 deg — the 4.7 h hold was flat (0.02 deg total) and the
  # de-energized check showed no slide; the balance point is within the
  # friction deadband here.
  yaw_park_deg: 176
  pitch_park_deg: 40
  # §33.2 verification before the motors are de-energized (commanded shutdown
  # only; see §33.3 for uncontrolled power loss).
  pos_tolerance_deg: 0.5
  vel_tolerance_deg_s: 1.0
  dwell_ms: 500
  speed_deg_s: 10
  # Verify/Dwell position-mode hold speed limit (deg/s). MUST be non-zero:
  # the CyberGear position loop is PINNED at LimitSpd=0, so a 0-limit hold
  # can never pull an axis back into the §33.2 window. Evidence (p3,
  # 2026-09-02): the speed-mode park move overshot the 176 deg yaw target by
  # 0.84 deg (drive velocity-loop lag ~0.13 s), the old Verify hold carried
  # LimitSpd=0, and the axis sat at the overshoot point (175.16 deg) for the
  # full 40 s shutdown window -> no PARKED. Kept LOW: the position loop
  # overshoots a fast correction by ~speed x 0.13 s of velocity-loop lag, so
  # a 2 deg/s hold corrects a ~0.8 deg residual in one pass and lands inside
  # the 0.5 deg window; a 10 deg/s hold would limit-cycle ~1.3 deg, outside
  # it.
  verify_speed_deg_s: 2.0

# §38/§39 safety supervisor + watchdog tuning.
safety:
  # §39.2 stale motor feedback -> no open-loop.
  # 100 ms (architecture §39.2 default). The CyberGear emits feedback
  # ONLY in response to a command (CyberGear_AI_Reference.md §21 — no
  # periodic telemetry), so CanMotorBackend::command() sends a
  # same-value LimitSpd keepalive write whenever feedback ages past
  # 30 ms; the age therefore stays below ~40 ms in normal operation and
  # 100 ms remains a genuine loss-of-feedback detector (a dead drive or
  # dropped bus trips the brake within ~100 ms).
  feedback_max_age_ms: 100
  deadline_max_us: 2000         # §39.3 cycle longer than this counts as a miss
  deadline_miss_threshold: 5    # misses in the window before a derate
  motor_overtemp_c: 75.0        # §38 over-temperature fault threshold

camera:
  intrinsics_file: calibration/camera_intrinsics.yaml
  extrinsics_file: calibration/camera_extrinsics.yaml

installation:
  pose_file: calibration/installation_pose.yaml

payload:
  active_profile: conservative
  profile_dir: config/payload_profiles
  # §27 OPTIONAL_PAYLOAD_RESPONSE_CHECK: verify the loaded profile once on
  # first hold after homing (post-homing, pre-READY_HOLD).
  auto_verify: false
  # §44 "safe central region": per-axis half-span of the payload-check region.
  # The region is centered on each axis's pose at check start (the ready
  # pose) and intersected with the homed soft limits, so the check is valid
  # from any homed pose. 10 deg leaves a wide margin for the 2 deg step +
  # 2 deg edge margin; the ready pose sits ~37 deg from the nearest stop on
  # both axes.
  check_region_half_span_deg: 10.0
  # Drive current limit (A) applied to BOTH axes for the payload check. The
  # post-homing LimitCur (3 A pitch / 1 A yaw) is marginal for a 2 deg
  # position-mode step, so the check raises both to this value (5 A, under
  # the 10 A station cap) and leaves it there (the position holds are more
  # authoritative at 5 A).
  check_current_a: 5.0
  # Drive inner speed-loop gains applied to BOTH axes at payload-check start.
  # The stock CyberGear gains (SpdKp=1.0, SpdKi=0.002) are too weak to hold the
  # position-mode speed limit against the pitch's gravity load: the
  # "against-gravity" half of the 2 deg step creeps and times out while the
  # "with-gravity" half is assisted and fast. Raising them (5x) lets the inner
  # loop build the torque to hold the commanded rate against gravity, so the
  # step response is the drive's controlled (mass-sensitive) response, not a
  # gravity-dominated creep. Still bounded by the current/torque limits.
  check_spd_kp: 5.0
  check_spd_ki: 0.02
